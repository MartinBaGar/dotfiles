# Font Configuration
font_size 14.0

# Sound Configuration
enable_audio_bell no

# Window Configuration
window_padding_width 12
background_opacity 1.0
background_blur 32
hide_window_decorations yes

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

# BEGIN_KITTY_FONTS
font_family      family='DejaVuSansM Nerd Font Mono'
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


# BEGIN_KITTY_THEME
# Base2Tone Lavender Dark
include current-theme.conf
# include Modus Operandi Tinted.conf
# END_KITTY_THEME

# Allow scrollback in Emacsclient
map ctrl+shift+h launch --stdin-source=@screen_scrollback --type=overlay sh -c 'tmp=$(mktemp /tmp/kitty_scrollback.XXXXXX); cat > "$tmp"; emacsclient -nw --socket-name=term -e "(find-file \"$tmp\")" -e "(goto-char (point-max))" -e "(re-search-backward \"^[[:space:]]*[^[:space:]]\" nil t)"; rm "$tmp"'

# Create a new window splitting the space used by the existing one so that
# the two windows are placed one above the other
map shift+alt+h launch --location=hsplit

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side
map shift+alt+v launch --location=vsplit

# Create a new window splitting the space used by the existing one so that
# the two windows are placed side by side if the existing window is wide or
# one above the other if the existing window is tall.
# map f4 launch --location=split

# Rotate the current split, changing its split axis from vertical to
# horizontal or vice versa
map shift+alt+r layout_action rotate

# Move the active window in the indicated direction
# map shift+up move_window up
# map shift+left move_window left
# map shift+right move_window right
# map shift+down move_window down

# Move the active window to the indicated screen edge
# map ctrl+shift+up layout_action move_to_screen_edge top
# map ctrl+shift+left layout_action move_to_screen_edge left
# map ctrl+shift+right layout_action move_to_screen_edge right
# map ctrl+shift+down layout_action move_to_screen_edge bottom

# Switch focus to the neighboring window in the indicated direction
map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+k neighboring_window up
map alt+j neighboring_window down

# Set the bias of the split containing the currently focused window. The
# currently focused window will take up the specified percent of its parent
# window's size.
# map ctrl+. layout_action bias 80
